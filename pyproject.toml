[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-assistant"
version = "0.1.0"
description = "A LangGraph multi-agent healthcare assistant (hobby project, no medical value)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Robert Tartarotti", email = "robert.tartarotti@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.2.0",
    "httpx>=0.26.0,<0.28",
    "chromadb>=0.5.0",
    "pypdf>=4.0.0",
    "openai>=1.0.0",
]

[project.scripts]
healthcare-assistant-api = "fastapi_app.__main__:main"
healthcare-assistant-frontend = "fastapi_app.frontend:main"
healthcare-assistant-ingest = "healthcare_assistant_lib.rag.ingest:main"
healthcare-assistant-update-db = "healthcare_assistant_lib.rag.ingest:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    "lizard>=1.17.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["healthcare_assistant_lib*", "fastapi_app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501", "N818"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"fastapi_app/main.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
pythonpath = ["."]
addopts = ["--tb=short"]
