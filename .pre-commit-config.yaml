repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: lizard
        name: lizard
        entry: lizard
        language: python
        additional_dependencies: [lizard]
        types: [python]
        args: [--length, "50", --CCN, "10", --arguments, "5"]
        exclude: ^tests/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        exclude: ^\.env\.example$
      - id: trailing-whitespace
        exclude: ^\.env\.example$
